name: Build Windows Executable

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:  # 允许手动触发

jobs:
  build-windows:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        
    - name: Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
          
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller
        
    - name: Build executable
      run: |
        pyinstaller --onefile --windowed --name="Excel文件合并工具" merge_excel_file.py
        
    - name: Upload Windows executable
      uses: actions/upload-artifact@v3
      with:
        name: Excel文件合并工具-Windows
        path: dist/Excel文件合并工具.exe
        retention-days: 30
        
    - name: Create release assets
      if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
      run: |
        # 创建发布包
        mkdir release
        copy "dist\Excel文件合并工具.exe" release\
        copy README.md release\
        copy WINDOWS_BUILD_GUIDE.md release\
        
        # 创建ZIP包
        powershell Compress-Archive -Path release\* -DestinationPath "Excel文件合并工具-Windows.zip"
        
    - name: Upload release package
      if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
      uses: actions/upload-artifact@v3
      with:
        name: Excel文件合并工具-完整包
        path: Excel文件合并工具-Windows.zip
        retention-days: 90

  build-macos:
    runs-on: macos-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        
    - name: Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
          
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller
        
    - name: Build executable
      run: |
        pyinstaller --onefile --windowed --name="Excel文件合并工具" merge_excel_file.py
        
    - name: Upload macOS executable
      uses: actions/upload-artifact@v3
      with:
        name: Excel文件合并工具-macOS
        path: dist/Excel文件合并工具
        retention-days: 30
        
    - name: Upload macOS app
      uses: actions/upload-artifact@v3
      with:
        name: Excel文件合并工具-macOS-App
        path: dist/Excel文件合并工具.app
        retention-days: 30

  build-linux:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        
    - name: Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
          
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller
        
    - name: Build executable
      run: |
        pyinstaller --onefile --windowed --name="Excel文件合并工具" merge_excel_file.py
        
    - name: Upload Linux executable
      uses: actions/upload-artifact@v3
      with:
        name: Excel文件合并工具-Linux
        path: dist/Excel文件合并工具
        retention-days: 30 
