name: Build Executables

on:
  push:
    tags:
      - 'v*'  # 只在推送版本标签时触发
  workflow_dispatch:  # 允许手动触发

jobs:
  build-windows:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        
    - name: Cache pip dependencies
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
          
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller
        
    - name: Build executable
      run: |
        pyinstaller --onefile --windowed --name="ExcelMergerTool" merge_excel_file.py
        
    - name: Create Windows package
      run: |
        $version = "${{ github.ref_name }}"
        $projectName = "excel-merge-tools"
        $packageName = "$projectName-v$version-windows"
        
        # 创建发布包目录
        mkdir $packageName
        copy "dist\ExcelMergerTool.exe" $packageName\
        copy README.md $packageName\
        copy WINDOWS_BUILD_GUIDE.md $packageName\
        
        # 创建ZIP包
        powershell Compress-Archive -Path $packageName\* -DestinationPath "$packageName.zip"
        
    - name: Upload Windows package
      uses: actions/upload-artifact@v4
      with:
        name: excel-merge-tools-v${{ github.ref_name }}-windows
        path: excel-merge-tools-v${{ github.ref_name }}-windows.zip
        retention-days: 1

  build-macos:
    runs-on: macos-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        
    - name: Cache pip dependencies
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
          
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller
        
    - name: Build executable
      run: |
        pyinstaller --onefile --windowed --name="ExcelMergerTool" merge_excel_file.py
        
    - name: Create macOS package
      run: |
        version="${{ github.ref_name }}"
        projectName="excel-merge-tools"
        packageName="$projectName-v$version-macos"
        
        # 创建发布包目录
        mkdir "$packageName"
        cp "dist/ExcelMergerTool" "$packageName/"
        cp README.md "$packageName/"
        cp BUILD_INSTRUCTIONS.md "$packageName/"
        
        # 创建ZIP包
        zip -r "$packageName.zip" "$packageName/"
        
    - name: Upload macOS package
      uses: actions/upload-artifact@v4
      with:
        name: excel-merge-tools-v${{ github.ref_name }}-macos
        path: excel-merge-tools-v${{ github.ref_name }}-macos.zip
        retention-days: 1 
